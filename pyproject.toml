[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-imagegen"
version = "0.3.0"
description = "Azure OpenAI image generation and editing plugin for Codex with a bundled Python CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DangerMouseUK" }]
keywords = [
  "azure-openai",
  "image-generation",
  "codex-skill",
  "plugin",
  "python",
]
dependencies = [
  "openai>=3.22.1,<4",
  "pillow>=12.3.0,<13",
]

[project.optional-dependencies]
entra = [
  "azure-identity>=1.26.0,<2",
]
dev = [
  "pytest>=9.1.1,<10",
  "pyyaml>=6.0.3,<7",
]

[project.urls]
Homepage = "https://github.com/dangermouseuk/azure-imagegen"
Repository = "https://github.com/dangermouseuk/azure-imagegen"
Issues = "https://github.com/dangermouseuk/azure-imagegen/issues"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
py-modules = []
